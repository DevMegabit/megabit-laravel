name: Tests

on:
  push:
    branches: [2.x]
  pull_request:
    branches: [2.x]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [8.4, 8.3]
        laravel: [13.*, 12.*]
        firebird: [5, 4, 3]
        include:
          - laravel: 13.*
            testbench: ^11.0
          - laravel: 12.*
            testbench: ^10.3
      fail-fast: false

    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, Firebird ${{ matrix.firebird }}

    services:
      firebird:
        image: firebirdsql/firebird:${{ matrix.firebird }}
        env:
          FIREBIRD_DATABASE: "database.fdb"
          FIREBIRD_ROOT_PASSWORD: "masterkey"
          FIREBIRD_USE_LEGACY_AUTH: "true"
          FIREBIRD_DATABASE_DEFAULT_CHARSET: "UTF8"
          FIREBIRD_DATABASE_PAGE_SIZE: "16384"
        ports:
          - 3050:3050

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_firebird
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:^12.0" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit
